<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0E1116; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; background: #0E1116; outline: none; }
      #status { position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
                font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 15px; color: #A9B2C0; }
      #bar { width: 240px; height: 4px; background: #2A313D; margin: 12px auto 0 auto; border-radius: 2px; }
      #fill { width: 0; height: 4px; background: #5E9CF0; border-radius: 2px; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="status"><div id="message">Loading divergence</div><div id="bar"><div id="fill"></div></div></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var statusBox = document.getElementById("status");
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        document.getElementById("fill").style.width = (progress * 100) + "%";
      }).then(function (instance) {
        window.unityInstance = instance;
        statusBox.style.display = "none";
      }).catch(function (message) {
        document.getElementById("message").textContent = "This browser could not start the simulation. Try a recent Chrome, Edge, Firefox or Safari. (" + message + ")";
        document.getElementById("bar").style.display = "none";
      });
    </script>
  </body>
</html>
