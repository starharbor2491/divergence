<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        background: radial-gradient(circle at 50% 42%, #0B2032 0%, #061019 72%);
      }
      #unity-canvas {
        position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
        display: block; background: #061019; outline: none;
      }
      #status {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        padding: 28px 36px; border-radius: 22px; text-align: center;
        background: rgba(12, 25, 38, 0.68);
        border: 1px solid rgba(255, 255, 255, 0.24);
        box-shadow: 0 20px 48px rgba(2, 8, 15, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Segoe UI", sans-serif;
        color: #F2F8FD;
      }
      #title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
      #message { font-size: 14px; color: #BDD0E2; }
      #bar {
        width: 260px; height: 6px; background: rgba(6, 17, 27, 0.65);
        border: 1px solid rgba(165, 210, 240, 0.16);
        margin: 16px auto 0 auto; border-radius: 999px; overflow: hidden;
      }
      #fill {
        width: 0; height: 100%;
        background: linear-gradient(90deg, #24BFA6 0%, #36DFC4 60%, #7CF5E0 100%);
        border-radius: 999px; transition: width 0.12s ease-out;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="status">
      <div id="title">Divergence</div>
      <div id="message">Preparing the living World</div>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var statusBox = document.getElementById("status");
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        document.getElementById("fill").style.width = (progress * 100) + "%";
      }).then(function (instance) {
        window.unityInstance = instance;
        statusBox.style.display = "none";
      }).catch(function (message) {
        document.getElementById("message").textContent = "This browser could not start the simulation. Try a recent Chrome, Edge, Firefox or Safari. (" + message + ")";
        document.getElementById("bar").style.display = "none";
      });
    </script>
  </body>
</html>
