<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236EC9A8' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath d='M4 12h6c4 0 5-6 10-6M10 12c4 0 5 6 10 6'/%3E%3Ccircle cx='4' cy='12' r='2' fill='%236EC9A8' stroke='none'/%3E%3Ccircle cx='20' cy='6' r='2' fill='%236EC9A8' stroke='none'/%3E%3Ccircle cx='20' cy='18' r='2' fill='%236EC9A8' stroke='none'/%3E%3C/svg%3E">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0C1117;
      }
      #unity-canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        background: #0C1117;
        outline: none;
      }
      #status {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #A6B0BE;
      }
      #message {
        font-size: 13px;
        letter-spacing: 0.01em;
      }
      #bar {
        width: 180px;
        height: 2px;
        background: rgba(255, 255, 255, 0.12);
        margin: 12px auto 0;
        border-radius: 1px;
        overflow: hidden;
      }
      #fill {
        width: 0;
        height: 100%;
        background: #EEF1F6;
        transition: width 0.1s linear;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="status">
      <div id="message">Loading Divergence</div>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var statusBox = document.getElementById("status");
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        document.getElementById("fill").style.width = (progress * 100) + "%";
      }).then(function (instance) {
        window.unityInstance = instance;
        statusBox.style.display = "none";
      }).catch(function (message) {
        document.getElementById("message").textContent = "Could not start WebGL (" + message + "). Try a recent Chrome, Firefox, Safari or Edge.";
        document.getElementById("bar").style.display = "none";
      });
    </script>
  </body>
</html>
